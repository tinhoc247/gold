const fmtD=t=>t?new Date(t).toLocaleString('vi-VN'):'';
async function repList(){clearInterval(CT);app('<div class="card"><p>Đang tải…</p></div>');
 let L={},note='';try{L=(await fb(G('sessions')))||{}}catch(e){note='⚠️ Không đọc được danh sách chung ('+e.message+'). Chỉ hiện các mã đã tạo trên máy này.'}
 const codes=new Set([...Object.keys(L),...(LSG('goldCodes')||[])]);
 for(const c of codes)if(!L[c]){try{const s=await fb(G('sessions/'+c));if(s)L[c]=s}catch(e){}}
 const A=Object.entries(L).map(([id,s])=>({id,...s})).sort((a,b)=>(b.created||0)-(a.created||0));
 app(`<div class="card"><h2>📊 Các lượt chơi</h2>${note?`<p class="err">${esc(note)}</p>`:''}${A.length?`<table class="sb"><tr><th>Mã</th><th>Tên</th><th>Ngày</th><th>Trạng thái</th><th></th></tr>${A.map(s=>{const st=s.status=='ended'||(s.status=='running'&&now()>=s.end)?'🔒 Đã kết thúc':s.status=='running'?'🟢 Đang chơi':'⏳ Chờ';return`<tr><td><b>${esc(s.id)}</b></td><td>${esc(s.title||'')}</td><td>${fmtD(s.created)}</td><td>${st}</td><td style="white-space:nowrap"><button class="mini" onclick="rep('${s.id}')">Báo cáo</button> <button class="mini" onclick="ctl('${s.id}')">Phòng</button> <button class="mini" style="background:#ef4444" onclick="delSes('${s.id}')">🗑</button></td></tr>`}).join('')}</table>`:'<p>Chưa có lượt nào.</p>'}<div class="row"><button class="alt" onclick="home()">← Quay lại</button></div></div>`)}
async function delSes(c){if(!confirm('Xóa lượt '+c+' cùng toàn bộ kết quả?\nKhông thể khôi phục.'))return;try{for(const p of['sessions','players','logs','quiz'])await fb(G(p+'/'+c),'DELETE');LSG('goldCodes',(LSG('goldCodes')||[]).filter(x=>x!=c))}catch(e){return alert('Không xóa được: '+e.message)}repList()}
async function rep(code){clearInterval(CT);app('<div class="card"><p>Đang tải báo cáo…</p></div>');
 let s,P,L,Qs;try{s=await fb(G('sessions/'+code));if(!s)throw Error('Không tìm thấy mã '+code);P=(await fb(G('players/'+code)))||{};L=(await fb(G('logs/'+code)))||{};Qs=JSON.parse((await fb(G('quiz/'+code)))||'[]').map(norm).filter(Boolean)}catch(e){return app(`<div class="card"><p class="err">${esc(e.message)}</p><button onclick="repList()">Quay lại</button></div>`)}
 const R=Object.entries(P).map(([id,v])=>({id,...v})).sort((a,b)=>(b.gold|0)-(a.gold|0)),md=['🥇','🥈','🥉'],w={};
 Object.values(L).forEach(a=>(a||[]).forEach(x=>{const r=w[x.i]=w[x.i]||{n:0,w:0};r.n++;if(!x.o)r.w++}));
 const all=Object.entries(w).map(([i,r])=>({i:+i,...r,p:Math.round(r.w*100/r.n)})).sort((a,b)=>b.p-a.p||b.w-a.w),hard=all.filter(r=>r.w>0).slice(0,10);
 const qh=x=>{const q=Qs[x.i];return`<div style="text-align:left;margin:8px 0"><div><b>Câu ${x.i+1}.</b> ${esc(((q&&q.q)||'').slice(0,200))}</div>${q&&q.img&&q.ty!='pt'?imgH(q.img,'oimg'):''}<div class="bar" style="width:${Math.max(4,x.p)}%"></div><span class="hint">Sai ${x.w}/${x.n} lượt (${x.p}%)</span></div>`};
 const tot=R.reduce((a,r)=>a+(r.ok|0)+(r.bad|0),0),okT=R.reduce((a,r)=>a+(r.ok|0),0),end=s.status=='ended'||(s.status=='running'&&now()>=s.end);
 app(`<div class="card"><h2>📊 ${esc(s.title||code)} <small>(${esc(code)})</small></h2><p class="hint">${s.nq||Qs.length} câu · 👥 ${R.length} người chơi · ${end?'🔒 Đã kết thúc':s.status=='running'?'🟢 Đang chơi':'⏳ Chờ bắt đầu'}${s.created?' · tạo '+fmtD(s.created):''}${tot?' · đúng chung '+okT+'/'+tot+' ('+Math.round(okT*100/tot)+'%)':''}</p>
 <h3>🏆 Xếp hạng &amp; báo cáo cá nhân</h3>${R.length?`<table class="sb"><tr><th>#</th><th>Người chơi</th><th>Vàng</th><th>Đúng/Tổng</th><th>%</th></tr>${R.map((r,i)=>{const t=(r.ok|0)+(r.bad|0);return`<tr><td>${md[i]||i+1}</td><td>${r.av||''} ${esc(r.name||'')}</td><td>💰 ${r.gold|0}</td><td>${r.ok|0}/${t}</td><td>${t?Math.round((r.ok|0)*100/t):0}%</td></tr>`}).join('')}</table>`:'<p class="hint">Chưa có người chơi.</p>'}
 <h3>❗ Câu hay sai nhất</h3>${hard.length?hard.map(qh).join(''):'<p class="hint">Chưa có câu nào bị sai.</p>'}
 ${all.length?`<details style="margin-top:8px"><summary><b>Thống kê tất cả các câu đã được trả lời (${all.length})</b></summary>${all.map(qh).join('')}</details>`:''}
 <div class="row" style="justify-content:center"><button onclick="rep('${code}')">↻ Làm mới</button><button class="alt" onclick="dlRep('${code}')">⬇ Tải CSV</button><button class="alt" onclick="repList()">Danh sách</button><button class="alt" onclick="home()">Trang chính</button></div></div>`);window.RP={P:R}}
function dlRep(code){const R=(window.RP&&RP.P)||[],q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',c='Tên,Đúng,Sai,Vàng\n'+R.map(r=>[r.name,r.ok|0,r.bad|0,r.gold|0].map(q).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+c],{type:'text/csv'}));a.download='bao-cao-'+code+'.csv';a.click()}

login();

</script></body></html>
